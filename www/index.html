<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>AI Помощник</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #111118;
      --card:    #1c1c2a;
      --accent:  #4a8eff;
      --text:    #e8e8f0;
      --muted:   #6b6b80;
      --green:   #33c47d;
      --red:     #e85555;
      --yellow:  #ffb840;
    }

    html, body {
      height: 100%; background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    .screen { display: none; flex-direction: column; height: 100dvh; padding: 16px; gap: 12px; }
    .screen.active { display: flex; }

    .header { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid #2a2a3a; }
    .header h1 { font-size: 22px; font-weight: 700; color: var(--accent); }
    .badge { margin-left: auto; font-size: 12px; padding: 4px 10px; border-radius: 20px; background: var(--card); color: var(--muted); }
